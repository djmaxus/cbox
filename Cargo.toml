[package]
name = "cbox"
version = "0.1.0"
edition = "2024"
description = "A tiny Rust TUI launcher for saving, fuzzy-finding, and injecting project-local shell commands. (Command Box)"
license = "MIT"
repository = "https://github.com/mukh4w/cbox"
readme = "README.md"
keywords = ["tui", "cli", "commands", "ratatui", "launcher"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
dirs = "7.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
